services:
  server:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    ports:
      - "8080:8080"
    working_dir: /app
    volumes:
      - ./backend:/app
      - nuget-cache:/root/.nuget/packages
      - /app/obj
      - /app/bin
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=fourway_db;Username=postgres;Password=SuperSecurePassword
    depends_on:
      database:
        condition: service_healthy
    command: dotnet watch run --no-hot-reload --non-interactive --no-launch-profile

  database:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fourway_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SuperSecurePassword
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fourway_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  nuget-cache:
  postgres-data: